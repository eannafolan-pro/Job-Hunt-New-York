name: Update NYC jobs

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours (UTC)
  workflow_dispatch:         # manual "Run workflow" button
  push:
    branches: [claude/access-probe-tmp, main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nyc-jobs
  cancel-in-progress: false

# The site is served from this branch, which MUST be the repository's default
# branch: the github-pages environment only accepts deployments from the default
# branch, and a deploy from any other is rejected before its first step runs.
env:
  SITE_BRANCH: claude/access-probe-tmp

jobs:
  scrape:
    runs-on: ubuntu-latest
    # The commit this job leaves the branch on. deploy must publish exactly this
    # commit: checking out SITE_BRANCH by name resolves to the ref as it was when
    # the run started, which is BEFORE the data commit below, so the site would
    # forever publish listings one run stale.
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SITE_BRANCH }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify parsing logic
        run: node scripts/test-parsing.mjs

      - name: Fetch job boards
        run: node scripts/fetch-jobs.mjs

      - name: Report board health
        run: |
          node -e "
            const d = require('./data/jobs.json');
            const bad = d.sources.filter(s => !s.ok);
            const out = [];
            out.push('## NYC job scrape');
            out.push('- jobs: ' + d.counts.total + ' (' + d.counts.active + ' active)');
            out.push('- boards ok: ' + d.counts.boardsOk + '/' + d.counts.boardsTotal);
            if (bad.length) {
              out.push('');
              out.push('### Boards that failed');
              for (const s of bad) out.push('- **' + s.company + '** (' + s.ats + '): ' + s.error);
            }
            console.log(out.join('\n'));
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage summary
        run: |
          node -e "
            const fs = require('fs');
            const rows = fs.readFileSync('data/coverage_report.csv','utf8').trim().split('\n').slice(1);
            const by = {};
            for (const line of rows) {
              const m = line.match(/,([a-z_]+),[^,]*$/);
              const o = m ? m[1] : 'unknown';
              (by[o] ||= []).push(line.split(',')[0]);
            }
            const out = ['## Target coverage (' + rows.length + ' companies)', '', '| outcome | count |', '|---|---|'];
            for (const [k,v] of Object.entries(by)) out.push('| ' + k + ' | ' + v.length + ' |');
            for (const [k,v] of Object.entries(by)) {
              if (k === 'ok') continue;
              out.push('', '### ' + k, v.join(', '));
            }
            console.log(out.join('\n'));
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Commit refreshed data
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/jobs.json data/coverage_report.csv; then
            echo "No change to data"
          else
            git add data/jobs.json data/coverage_report.csv
            git commit -m "chore: refresh NYC job listings [skip ci]"
            git push origin HEAD:"$SITE_BRANCH"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The exact commit scrape produced, not the branch name — see the comment
      # on the scrape job's outputs.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.scrape.outputs.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
